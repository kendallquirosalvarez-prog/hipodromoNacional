<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Eventos - Hipódromo Nacional</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f0f2f5; }
        .navbar { background: #1a1a2e; padding: 15px 30px; display: flex; align-items: center; justify-content: space-between; }
        .navbar h1 { color: #e94560; font-size: 20px; }
        .navbar nav a { color: #fff; text-decoration: none; margin-left: 20px; font-size: 14px; }
        .navbar nav a:hover { color: #e94560; }
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        h2 { margin-bottom: 20px; color: #1a1a2e; }
        .form-card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 30px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #555; margin-bottom: 5px; }
        input, select { width: 100%; padding: 9px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        input:focus, select:focus { outline: none; border-color: #e94560; }
        .btn { padding: 10px 24px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; margin-top: 15px; }
        .btn-primary { background: #e94560; color: white; }
        .btn-primary:hover { background: #c73652; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); overflow: hidden; }
        th { background: #1a1a2e; color: white; padding: 12px 15px; text-align: left; font-size: 13px; }
        td { padding: 12px 15px; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
        tr:hover td { background: #fafafa; }
        .btn-edit { background: #f39c12; color: white; padding: 5px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; text-decoration: none; }
        .btn-delete { background: #e74c3c; color: white; padding: 5px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; text-decoration: none; margin-left: 5px; }
        .badge { padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .badge-programado { background: #d5f5e3; color: #1e8449; }
        .badge-finalizado { background: #d6eaf8; color: #1a5276; }
        .badge-cancelado { background: #fadbd8; color: #922b21; }
    </style>
</head>
<body>
<div class="navbar">
    <h1>🏇 Hipódromo Nacional</h1>
    <nav>
        <a href="/">Inicio</a>
        <a href="/propietarios">Propietarios</a>
        <a href="/caballos">Caballos</a>
        <a href="/establos">Establos</a>
        <a href="/eventos">Eventos</a>
        <a href="/inscripciones">Inscripciones</a>
        <a href="/facturas">Facturas</a>
        <a href="/historial">Historial Vet.</a>
    </nav>
</div>

<div class="container">
    <h2>Gestión de Eventos</h2>

    <div class="form-card">
        <h3 style="margin-bottom:15px; color:#1a1a2e;">Registrar Evento</h3>
        <form th:action="@{/eventos/guardar}" th:object="${evento}" method="post">
            <div class="form-grid">
                <div>
                    <label>Código de Evento</label>
                    <input type="text" th:field="*{idEvento}" required/>
                </div>
                <div>
                    <label>Nombre</label>
                    <input type="text" th:field="*{nombre}" required/>
                </div>
                <div>
                    <label>Fecha y Hora</label>
                    <input type="datetime-local" th:field="*{fecha}" required/>
                </div>
                <div>
                    <label>Tipo de Carrera</label>
                    <select th:field="*{tipoCarrera}" required>
                        <option value="">Seleccione</option>
                        <option value="Plana">Plana</option>
                        <option value="Obstáculos">Obstáculos</option>
                        <option value="Velocidad">Velocidad</option>
                    </select>
                </div>
                <div>
                    <label>Distancia (metros)</label>
                    <input type="number" th:field="*{distancia}" required/>
                </div>
                <div>
                    <label>Premio Total (₡)</label>
                    <input type="number" step="0.01" th:field="*{premioTotal}" required/>
                </div>
                <div>
                    <label>Estado</label>
                    <select th:field="*{estado}" required>
                        <option value="">Seleccione</option>
                        <option value="Programado">Programado</option>
                        <option value="Finalizado">Finalizado</option>
                        <option value="Cancelado">Cancelado</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Guardar Evento</button>
        </form>
    </div>

    <h3 style="margin-bottom:15px; color:#1a1a2e;">Lista de Eventos</h3>
    <table>
        <thead>
            <tr>
                <th>Código</th>
                <th>Nombre</th>
                <th>Fecha</th>
                <th>Tipo</th>
                <th>Distancia</th>
                <th>Premio Total</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="e : ${eventos}">
                <td th:text="${e.idEvento}"></td>
                <td th:text="${e.nombre}"></td>
                <td th:text="${e.fecha}"></td>
                <td th:text="${e.tipoCarrera}"></td>
                <td th:text="${e.distancia} + ' m'"></td>
                <td th:text="'₡' + ${e.premioTotal}"></td>
                <td>
                    <span th:class="${'badge badge-' + #strings.toLowerCase(e.estado)}"
                          th:text="${e.estado}"></span>
                </td>
                <td>
                    <a th:href="@{/eventos/editar/{id}(id=${e.idEvento})}"
                       class="btn-edit">Editar</a>
                    <a th:href="@{/eventos/eliminar/{id}(id=${e.idEvento})}"
                       class="btn-delete"
                       onclick="return confirm('¿Eliminar este evento?')">Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
