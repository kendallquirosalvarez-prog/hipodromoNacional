<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0d1117;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }

  .card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    padding: 36px 40px;
    background: #161b27;
    border: 2px solid #c8a84b;
    border-radius: 18px;
    box-shadow: 0 0 40px rgba(200,168,75,0.18), 0 8px 32px rgba(0,0,0,0.5);
  }

  .title {
    font-size: 1.15rem;
    font-weight: 700;
    color: #ffd700;
    letter-spacing: 0.5px;
    text-align: center;
  }

  .subtitle {
    font-size: 0.78rem;
    color: #8b949e;
    text-align: center;
    margin-top: -12px;
  }

  .qr-wrapper {
    padding: 14px;
    background: white;
    border-radius: 12px;
    border: 5px solid #1a1408;
    box-shadow: 0 0 0 2px #c8a84b, 0 4px 16px rgba(0,0,0,0.4);
    line-height: 0;
  }

  .qr-wrapper img {
    width: 260px;
    height: 260px;
    display: block;
    image-rendering: pixelated;
  }

  .url-label {
    font-size: 0.7rem;
    color: #58a6ff;
    font-family: 'Consolas', 'Courier New', monospace;
    text-align: center;
    word-break: break-all;
    max-width: 290px;
  }

  .tags {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .tag {
    font-size: 0.68rem;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 20px;
    border: 1px solid;
  }

  .tag-green  { color: #3fb950; border-color: #2a4a2a; background: #0d2010; }
  .tag-blue   { color: #58a6ff; border-color: #1a3a6a; background: #0d1a3a; }
  .tag-purple { color: #bc8cff; border-color: #3a2a6a; background: #1a0d3a; }
  .tag-gold   { color: #ffd700; border-color: #5a4800; background: #1a1200; }

  .footer {
    font-size: 0.68rem;
    color: #4a5568;
    text-align: center;
  }
</style>
</head>
